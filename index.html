<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <title>Mi PWA Suma</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Banner de instalación (oculto por defecto) -->
  <div id="bannerInstalar" class="banner" hidden>
    <div class="banner-info">
      <img src="icon-192.png" alt="Icono" class="banner-icon">
      <div>
        <strong>Instala nuestra App</strong>
        <p>Accede más rápido y úsala sin conexión</p>
      </div>
    </div>
    <div class="banner-acciones">
      <button id="btnInstalar" class="btn-primario">Instalar</button>
      <button id="btnCerrarBanner" class="btn-secundario">Ahora no</button>
    </div>
  </div>

  <h1>🚀 Mi PWA Suma</h1>
  <p>Introduce dos números para sumarlos</p>

  <div class="card">
    <input type="number" id="num1" placeholder="Primer número" step="any">
    <input type="number" id="num2" placeholder="Segundo número" step="any">
    <button id="btnSumar">Sumar</button>
    <div id="resultado"></div>
  </div>

  <p id="estado">Cargando...</p>

  <script src="app.js"></script>
  <script src="suma.js"></script>
</body>
</html>
