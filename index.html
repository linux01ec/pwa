<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
    <!-- Enlace al manifiesto de la PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Color de la barra de notificaciones en Android -->
    <meta name="theme-color" content="#2196F3">
</head>

<body>
    <div>
        <label for="num1">Numero 1</label>
        <input type="number" name="num1" id="num1">
    </div>
    <br>
    <div>
        <label for="num2">Numero 2</label>
        <input type="number" name="num2" id="num2">
    </div>
    <br>
    <!-- Le pusimos un ID al botón para controlarlo limpiamente desde JS -->
    <button id="btnSumar">Sumar</button>
    <br><br>
    <div>
        <label for="resultado">Resultado</label>
        <input readonly type="number" name="resultado" id="resultado">
    </div>

    <!-- Tu archivo JS separado -->
    <script src="sumadora.js"></script>

    <!-- Script para registrar la PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registrado con éxito'))
                .catch(err => console.log('Error al registrar el Service Worker', err));
        }
    </script>
</body>

</html>
