<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo PWA</title>
    
    <!-- Enlace al manifiesto físico -->
    <link rel="manifest" href="/sumadora/manifest.json">
    <meta name="theme-color" content="#2196F3">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            font-size: 2.5rem;
        }
    </style>
</head>
<body>

    <h1>Hola Mundo</h1>

    <script>
        // Registrar el Service Worker de manera limpia (también generado por Blob para mantenerlo 100% en el HTML)
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'hola-v1';
                self.addEventListener('install', e => {
                    self.skipWaiting();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(response => {
                            return response || fetch(e.request);
                        })
                    );
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob))
                .then(() => console.log('Service Worker registrado correctamente'))
                .catch(err => console.log('Error en Service Worker', err));
        }
    </script>
</body>
</html>
